# PayTrizz Production Nginx Reverse Proxy Configuration
# Optimized for Next.js RSC, Gin API, AWS SES Webhooks, and SSE Streaming

upstream paytrizz_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream paytrizz_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name paytrizz.com www.paytrizz.com webmail.paytrizz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name paytrizz.com www.paytrizz.com webmail.paytrizz.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/paytrizz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paytrizz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Global Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Body Size Limits
    client_max_body_size 25M;

    # 1. AWS SES Inbound & Outbound Webhooks (Direct pass-through to Go Backend)
    location /hooks/ses/ {
        proxy_pass http://paytrizz_backend/hooks/ses/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Real-time Server-Sent Events (SSE) Stream
    # Buffering MUST be turned off and timeout extended per PRD 5.5
    location ~* ^/(api/mail/stream|api/proxy/mail/stream) {
        proxy_pass http://paytrizz_backend/api/mail/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 3. Direct Backend API (Optional direct route)
    location /api/ {
        proxy_pass http://paytrizz_frontend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Uploaded media (Go backend stores it; Next.js rewrites /storage in dev)
    location /storage/ {
        proxy_pass http://paytrizz_backend/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 5. Next.js Static Assets
    location /_next/static/ {
        proxy_pass http://paytrizz_frontend/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 6. Frontend Application (Next.js SSR & RSC)
    location / {
        proxy_pass http://paytrizz_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
